name: Purge Old Data Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger purge
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/purge" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
